service: cartflow-backend
frameworkVersion: '3'

configValidationMode: error

plugins:
  - serverless-esbuild

custom:
  stage: ${opt:stage, 'dev'}
  stageConfig: ${file(./config/${self:custom.stage}.yml)}
  names:
    table: ${self:service}-${self:custom.stage}-app
    bucket: ${self:service}-${self:custom.stage}-${self:custom.stageConfig.resourceSuffix}-product-images
    userPool: ${self:service}-${self:custom.stage}
    userPoolClient: ${self:service}-${self:custom.stage}-web
  esbuild:
    bundle: true
    minify: ${self:custom.stageConfig.esbuild.minify}
    sourcemap: ${self:custom.stageConfig.esbuild.sourcemap}
    target: node18
    platform: node
    concurrency: 10
    exclude:
      - '@aws-sdk/*'

provider:
  name: aws
  runtime: nodejs18.x
  region: ${self:custom.stageConfig.region}
  stage: ${self:custom.stage}
  architecture: arm64
  memorySize: ${self:custom.stageConfig.lambda.memorySize}
  timeout: ${self:custom.stageConfig.lambda.timeout}
  logRetentionInDays: ${self:custom.stageConfig.lambda.logRetentionInDays}
  versionFunctions: false
  deploymentMethod: direct
  stackTags:
    Application: CartFlow
    Stage: ${self:custom.stage}
    ManagedBy: ServerlessFramework
  environment:
    NODE_ENV: ${self:custom.stageConfig.nodeEnv}
    NODE_OPTIONS: --enable-source-maps
    AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
    CARTFLOW_TABLE_NAME:
      Ref: CartFlowTable
    PRODUCT_IMAGES_BUCKET_NAME:
      Ref: ProductImagesBucket
    COGNITO_USER_POOL_ID:
      Ref: CartFlowUserPool
    COGNITO_APP_CLIENT_ID:
      Ref: CartFlowUserPoolClient
    JWT_ISSUER:
      Fn::Join:
        - ''
        - - https://cognito-idp.
          - Ref: AWS::Region
          - .amazonaws.com/
          - Ref: CartFlowUserPool
    ALLOWED_ORIGINS: ${self:custom.stageConfig.cors.allowedOriginsCsv}
    UPLOAD_URL_EXPIRES_SECONDS: ${self:custom.stageConfig.uploads.presignedUrlExpiresSeconds}
    MAX_UPLOAD_BYTES: ${self:custom.stageConfig.uploads.maxBytes}
    DEFAULT_PAGE_LIMIT: ${self:custom.stageConfig.pagination.defaultLimit}
    MAX_PAGE_LIMIT: ${self:custom.stageConfig.pagination.maxLimit}
    ADMIN_GROUP_NAME: ${self:custom.stageConfig.auth.adminGroupName}
    CUSTOMER_GROUP_NAME: ${self:custom.stageConfig.auth.customerGroupName}
  httpApi:
    cors:
      allowedOrigins: ${self:custom.stageConfig.cors.allowedOrigins}
      allowedHeaders:
        - authorization
        - content-type
        - x-requested-with
        - idempotency-key
      allowedMethods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowCredentials: false
      maxAge: 300
    authorizers:
      cognitoJwt:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl:
          Fn::Join:
            - ''
            - - https://cognito-idp.
              - Ref: AWS::Region
              - .amazonaws.com/
              - Ref: CartFlowUserPool
        audience:
          - Ref: CartFlowUserPoolClient
  # No provider-level DynamoDB/S3 statements here on purpose. Every function
  # below carries an explicit `role:` pointing at one of the three
  # least-privilege roles defined under `resources.Resources` (PublicRead /
  # CustomerCart / AdminWrite). A single shared role sized for the most
  # privileged function (used to be the case here) means a compromised
  # *public, unauthenticated* handler — e.g. `productsGet` — would run with
  # permission to `DeleteItem`/`UpdateItem` on the whole table. See
  # docs/database.md, "IAM: Per-Function Least Privilege".
  #
  # `health` intentionally gets no `role:` override at all — it touches no
  # AWS resource, so the bare default role (just `AWSLambdaBasicExecutionRole`
  # for CloudWatch Logs, nothing else) is already least-privilege for it.

package:
  individually: true
  patterns:
    - '!coverage/**'
    - '!tests/**'
    - '!src/**/*.test.ts'

functions:
  health:
    description: CartFlow health check. Business routes are added incrementally.
    handler: src/handlers/health.handler
    events:
      - httpApi:
          method: GET
          path: /health

  productsList:
    description: List active products, optionally filtered by category. Public.
    handler: src/handlers/products/list.handler
    role: PublicReadExecutionRole
    events:
      - httpApi:
          method: GET
          path: /api/v1/products

  productsGet:
    description: Get a single product by id. Public.
    handler: src/handlers/products/get.handler
    role: PublicReadExecutionRole
    events:
      - httpApi:
          method: GET
          path: /api/v1/products/{id}

  productsGetInventory:
    description: Get a product's public stock availability. Public.
    handler: src/handlers/products/get-inventory.handler
    role: PublicReadExecutionRole
    events:
      - httpApi:
          method: GET
          path: /api/v1/products/{id}/inventory

  productsCreate:
    description: Create a product. Admin only.
    handler: src/handlers/products/create.handler
    role: AdminWriteExecutionRole
    events:
      - httpApi:
          method: POST
          path: /api/v1/products
          authorizer:
            name: cognitoJwt

  productsUpdate:
    description: Update editable fields on a product. Admin only.
    handler: src/handlers/products/update.handler
    role: AdminWriteExecutionRole
    events:
      - httpApi:
          method: PUT
          path: /api/v1/products/{id}
          authorizer:
            name: cognitoJwt

  productsDelete:
    description: Deactivate (soft delete) a product. Admin only.
    handler: src/handlers/products/remove.handler
    role: AdminWriteExecutionRole
    events:
      - httpApi:
          method: DELETE
          path: /api/v1/products/{id}
          authorizer:
            name: cognitoJwt

  productsAdminList:
    description: List products by status (defaults ACTIVE), for the admin dashboard. Admin only.
    handler: src/handlers/products/admin-list.handler
    role: AdminWriteExecutionRole
    events:
      - httpApi:
          method: GET
          path: /api/v1/admin/products
          authorizer:
            name: cognitoJwt

  adminInventoryGet:
    description: Get the full inventory record (available/reserved/reorder threshold) for a product. Admin only.
    handler: src/handlers/inventory/admin-get.handler
    role: AdminWriteExecutionRole
    events:
      - httpApi:
          method: GET
          path: /api/v1/admin/inventory/{id}
          authorizer:
            name: cognitoJwt

  adminInventoryUpdate:
    description: Set a product's available quantity and/or reorder threshold. Admin only.
    handler: src/handlers/inventory/admin-update.handler
    role: AdminWriteExecutionRole
    events:
      - httpApi:
          method: PUT
          path: /api/v1/admin/inventory/{id}
          authorizer:
            name: cognitoJwt

  cartGet:
    description: Get the authenticated caller's own cart, hydrated with current prices.
    handler: src/handlers/cart/get.handler
    role: CustomerCartExecutionRole
    events:
      - httpApi:
          method: GET
          path: /api/v1/cart
          authorizer:
            name: cognitoJwt

  cartAddItem:
    description: Add a product to the authenticated caller's cart.
    handler: src/handlers/cart/add-item.handler
    role: CustomerCartExecutionRole
    events:
      - httpApi:
          method: POST
          path: /api/v1/cart/items
          authorizer:
            name: cognitoJwt

  cartUpdateItem:
    description: Set an existing cart line to an absolute quantity.
    handler: src/handlers/cart/update-item.handler
    role: CustomerCartExecutionRole
    events:
      - httpApi:
          method: PATCH
          path: /api/v1/cart/items/{productId}
          authorizer:
            name: cognitoJwt

  cartRemoveItem:
    description: Remove a line from the authenticated caller's cart.
    handler: src/handlers/cart/remove-item.handler
    role: CustomerCartExecutionRole
    events:
      - httpApi:
          method: DELETE
          path: /api/v1/cart/items/{productId}
          authorizer:
            name: cognitoJwt

  cartClear:
    description: Empty the authenticated caller's cart.
    handler: src/handlers/cart/clear.handler
    role: CustomerCartExecutionRole
    events:
      - httpApi:
          method: DELETE
          path: /api/v1/cart
          authorizer:
            name: cognitoJwt

  uploadsCreatePresignedUrl:
    description: Generate a presigned S3 PUT URL for a product image upload. Admin only.
    handler: src/handlers/uploads/create-presigned-url.handler
    role: AdminWriteExecutionRole
    events:
      - httpApi:
          method: POST
          path: /api/v1/uploads/presigned-url
          authorizer:
            name: cognitoJwt

resources:
  Resources:
    # Structured access log for every request the API receives — method,
    # route, status, latency, caller IP, and the same `requestId` that
    # appears in the JSON error envelope (`utils/request-id.ts`) and in
    # application logs, so a support ticket referencing a `requestId` can be
    # traced end to end. Previously, nothing logged 2xx/4xx traffic at all —
    # only truly unexpected 500s ever reached CloudWatch (see
    # `middleware/error-handler.ts`), so there was no way to see request
    # volume, latency, or 401/403/404 patterns after the fact. See
    # PRODUCTION_READINESS.md, "Logging".
    ApiAccessLogGroup:
      Type: AWS::Logs::LogGroup
      Properties:
        LogGroupName: /aws/http-api/${self:service}-${self:custom.stage}
        RetentionInDays: ${self:custom.stageConfig.lambda.logRetentionInDays}

    # API Gateway (HTTP API) needs an explicit grant to write into a log
    # group it doesn't own — without this, `AccessLogSettings` below fails
    # silently (the stage deploys fine; log lines just never show up) unless
    # this AWS account already happened to have the classic REST-API
    # CloudWatch role configured account-wide. `AWS::Logs::ResourcePolicy`
    # is capped at 10 per account/region — if that becomes a constraint
    # across services sharing this account, consolidate into one
    # cross-service policy rather than dropping this one.
    ApiAccessLogGroupPolicy:
      Type: AWS::Logs::ResourcePolicy
      Properties:
        PolicyName: ${self:service}-${self:custom.stage}-apigw-access-logs
        PolicyDocument:
          Fn::Sub: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"apigateway.amazonaws.com"},"Action":["logs:CreateLogStream","logs:PutLogEvents"],"Resource":"${ApiAccessLogGroup.Arn}"}]}

    # Default (stage-wide) throttling for every route. `serverless-framework`
    # has no `provider.httpApi.throttle` shorthand for HTTP API (that's a
    # REST-API-only feature) — the documented workaround is overriding the
    # `DefaultRouteSettings` on the auto-generated `$default` stage resource
    # directly. This is a coarse request-flood safety net, not per-user/
    # per-IP fairness — see PRODUCTION_READINESS.md, "Rate limiting".
    HttpApiStage:
      Type: AWS::ApiGatewayV2::Stage
      Properties:
        DefaultRouteSettings:
          ThrottlingBurstLimit: ${self:custom.stageConfig.throttle.burstLimit}
          ThrottlingRateLimit: ${self:custom.stageConfig.throttle.rateLimit}
        AccessLogSettings:
          DestinationArn:
            Fn::GetAtt: [ApiAccessLogGroup, Arn]
          # A fixed field order, one JSON object per request — deliberately
          # not the "$context.error.message" field, which can echo back
          # request content; everything here is metadata, never payload.
          Format: >-
            {"requestId":"$context.requestId","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","routeKey":"$context.routeKey","status":"$context.status","responseLength":"$context.responseLength","latencyMs":"$context.responseLatency","sourceIp":"$context.identity.sourceIp","userAgent":"$context.identity.userAgent","integrationErrorMessage":"$context.integrationErrorMessage"}

    # --- Per-function least-privilege IAM roles -----------------------------
    #
    # Three roles, sized to the narrowest set of actions any function in
    # that group actually calls (verified against the repository code, not
    # guessed from the API surface — e.g. `dynamodb:BatchGetItem` and
    # `dynamodb:ConditionCheckItem` were previously granted account-wide but
    # are never issued by any repository, and `dynamodb:DeleteItem` is only
    # reachable through `ProductRepository.delete()`, a hard-delete method no
    # handler currently calls — see docs/database.md, "IAM: Per-Function
    # Least Privilege" for the full rationale and the audit trail).
    #
    # Each trusts only `lambda.amazonaws.com` and gets the standard
    # `AWSLambdaBasicExecutionRole` managed policy for CloudWatch Logs, the
    # same baseline Serverless Framework's own auto-generated role would use.
    PublicReadExecutionRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: ${self:service}-${self:custom.stage}-public-read
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        Policies:
          - PolicyName: dynamodb-read-only
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Sid: TableRead
                  Effect: Allow
                  Action:
                    - dynamodb:DescribeTable
                    - dynamodb:GetItem
                    - dynamodb:Query
                  Resource:
                    - Fn::GetAtt: [CartFlowTable, Arn]
                - Sid: Gsi1Read
                  Effect: Allow
                  Action:
                    - dynamodb:Query
                  Resource:
                    - Fn::Join: ['', [Fn::GetAtt: [CartFlowTable, Arn], /index/GSI1]]
        Tags:
          - Key: Application
            Value: CartFlow
          - Key: Stage
            Value: ${self:custom.stage}

    # Cart handlers only ever read products/inventory by primary key and
    # read/write the caller's own cart partition — never GSI1, never S3,
    # never another user's data (userId comes from the verified JWT, not
    # request input; see middleware/auth.ts).
    CustomerCartExecutionRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: ${self:service}-${self:custom.stage}-customer-cart
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        Policies:
          - PolicyName: dynamodb-cart-read-write
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Sid: TableCartReadWrite
                  Effect: Allow
                  Action:
                    - dynamodb:GetItem
                    - dynamodb:PutItem
                    - dynamodb:Query
                    - dynamodb:TransactWriteItems
                  Resource:
                    - Fn::GetAtt: [CartFlowTable, Arn]
        Tags:
          - Key: Application
            Value: CartFlow
          - Key: Stage
            Value: ${self:custom.stage}

    # The only role with write access to the product/inventory catalog and
    # to the product-images bucket — every function using it is already
    # gated by `requireAdmin()` at the application layer, so this is
    # defense in depth, not the primary control.
    AdminWriteExecutionRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: ${self:service}-${self:custom.stage}-admin-write
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        Policies:
          - PolicyName: dynamodb-catalog-read-write
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Sid: TableReadWrite
                  Effect: Allow
                  Action:
                    - dynamodb:DescribeTable
                    - dynamodb:GetItem
                    - dynamodb:PutItem
                    - dynamodb:Query
                    - dynamodb:UpdateItem
                  Resource:
                    - Fn::GetAtt: [CartFlowTable, Arn]
                - Sid: Gsi1Read
                  Effect: Allow
                  Action:
                    - dynamodb:Query
                  Resource:
                    - Fn::Join: ['', [Fn::GetAtt: [CartFlowTable, Arn], /index/GSI1]]
          - PolicyName: s3-product-images-read-write
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Sid: ProductImageObjectRead
                  Effect: Allow
                  Action:
                    - s3:AbortMultipartUpload
                    - s3:GetObject
                  Resource:
                    - Fn::Join: ['', [Fn::GetAtt: [ProductImagesBucket, Arn], /products/*]]
                - Sid: ProductImageObjectWrite
                  Effect: Allow
                  Action:
                    - s3:PutObject
                  Resource:
                    - Fn::Join: ['', [Fn::GetAtt: [ProductImagesBucket, Arn], /products/*]]
                  # Enforced by S3 itself against the ACTUAL uploaded object
                  # size at PUT time — not just a client-declared
                  # Content-Length the app validated before generating the
                  # URL. A presigned PUT (unlike a presigned POST policy)
                  # cannot embed a size limit in the signature itself, so
                  # this IAM condition is what makes the 5 MB cap
                  # authoritative. See docs/database.md, "Upload Consistency
                  # And Security".
                  Condition:
                    NumericLessThanEquals:
                      s3:RequestObjectSize: ${self:custom.stageConfig.uploads.maxBytes}
                - Sid: ProductImageBucketLocation
                  Effect: Allow
                  Action:
                    - s3:GetBucketLocation
                  Resource:
                    - Fn::GetAtt: [ProductImagesBucket, Arn]
        Tags:
          - Key: Application
            Value: CartFlow
          - Key: Stage
            Value: ${self:custom.stage}

    CartFlowTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${self:custom.stageConfig.dynamodb.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.stageConfig.dynamodb.deletionPolicy}
      Properties:
        TableName: ${self:custom.names.table}
        BillingMode: PAY_PER_REQUEST
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: ${self:custom.stageConfig.dynamodb.pointInTimeRecovery}
        SSESpecification:
          SSEEnabled: true
        # Backs the idempotency-key records `repositories/idempotency.repository.ts`
        # writes (`IDEMPOTENCY#...` partitions) — DynamoDB auto-deletes an item
        # once its `ttl` attribute (epoch seconds) is in the past. No other
        # item family sets `ttl`, so this is a no-op for the rest of the table.
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: GSI1PK
            AttributeType: S
          - AttributeName: GSI1SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: GSI1
            KeySchema:
              - AttributeName: GSI1PK
                KeyType: HASH
              - AttributeName: GSI1SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        Tags:
          - Key: Application
            Value: CartFlow
          - Key: Stage
            Value: ${self:custom.stage}

    ProductImagesBucket:
      Type: AWS::S3::Bucket
      DeletionPolicy: ${self:custom.stageConfig.s3.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.stageConfig.s3.deletionPolicy}
      Properties:
        BucketName: ${self:custom.names.bucket}
        OwnershipControls:
          Rules:
            - ObjectOwnership: BucketOwnerEnforced
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        VersioningConfiguration:
          Status: ${self:custom.stageConfig.s3.versioningStatus}
        CorsConfiguration:
          CorsRules:
            - AllowedHeaders:
                - content-type
                - x-amz-meta-product-id
              AllowedMethods:
                - PUT
              AllowedOrigins: ${self:custom.stageConfig.cors.allowedOrigins}
              ExposedHeaders:
                - etag
              MaxAge: 300
        LifecycleConfiguration:
          Rules:
            - Id: AbortIncompleteMultipartUploads
              Status: Enabled
              AbortIncompleteMultipartUpload:
                DaysAfterInitiation: 1
            - Id: ExpireTemporaryUploads
              Status: Enabled
              Prefix: tmp/
              ExpirationInDays: ${self:custom.stageConfig.s3.temporaryUploadExpirationDays}
        Tags:
          - Key: Application
            Value: CartFlow
          - Key: Stage
            Value: ${self:custom.stage}

    CartFlowUserPool:
      Type: AWS::Cognito::UserPool
      DeletionPolicy: ${self:custom.stageConfig.cognito.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.stageConfig.cognito.deletionPolicy}
      Properties:
        UserPoolName: ${self:custom.names.userPool}
        AutoVerifiedAttributes:
          - email
        UsernameAttributes:
          - email
        AccountRecoverySetting:
          RecoveryMechanisms:
            - Name: verified_email
              Priority: 1
        AdminCreateUserConfig:
          AllowAdminCreateUserOnly: false
        MfaConfiguration: 'OFF'
        Policies:
          PasswordPolicy:
            MinimumLength: 12
            RequireLowercase: true
            RequireNumbers: true
            RequireSymbols: false
            RequireUppercase: true
            TemporaryPasswordValidityDays: 7
        Schema:
          - Name: email
            AttributeDataType: String
            Mutable: true
            Required: true
        UserPoolTags:
          Application: CartFlow
          Stage: ${self:custom.stage}

    CartFlowUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: ${self:custom.names.userPoolClient}
        UserPoolId:
          Ref: CartFlowUserPool
        GenerateSecret: false
        PreventUserExistenceErrors: ENABLED
        ExplicitAuthFlows:
          - ALLOW_REFRESH_TOKEN_AUTH
          - ALLOW_USER_SRP_AUTH
          # The React frontend signs in via @aws-sdk/client-cognito-identity-provider's
          # InitiateAuth (USER_PASSWORD_AUTH), not the SRP protocol — trading the extra
          # protection of never sending the password itself (SRP proves knowledge of it
          # without transmitting it) for a browser client with no SRP math library
          # dependency. This is safe only because the app already requires HTTPS in
          # every real deployment, so the password is still protected in transit by TLS.
          - ALLOW_USER_PASSWORD_AUTH
        SupportedIdentityProviders:
          - COGNITO
        AllowedOAuthFlowsUserPoolClient: true
        AllowedOAuthFlows:
          - code
        AllowedOAuthScopes:
          - email
          - openid
          - profile
        CallbackURLs: ${self:custom.stageConfig.cognito.callbackUrls}
        LogoutURLs: ${self:custom.stageConfig.cognito.logoutUrls}
        AccessTokenValidity: 60
        IdTokenValidity: 60
        RefreshTokenValidity: 30
        TokenValidityUnits:
          AccessToken: minutes
          IdToken: minutes
          RefreshToken: days

    CustomerUserPoolGroup:
      Type: AWS::Cognito::UserPoolGroup
      Properties:
        GroupName: ${self:custom.stageConfig.auth.customerGroupName}
        Description: Standard CartFlow customer users.
        Precedence: 20
        UserPoolId:
          Ref: CartFlowUserPool

    AdminUserPoolGroup:
      Type: AWS::Cognito::UserPoolGroup
      Properties:
        GroupName: ${self:custom.stageConfig.auth.adminGroupName}
        Description: CartFlow administrators with catalog and inventory privileges.
        Precedence: 10
        UserPoolId:
          Ref: CartFlowUserPool

  Outputs:
    HttpApiId:
      Description: API Gateway HTTP API identifier.
      Value:
        Ref: HttpApi
    HttpApiUrl:
      Description: API Gateway HTTP API base URL.
      Value:
        Fn::Join:
          - ''
          - - https://
            - Ref: HttpApi
            - .execute-api.
            - Ref: AWS::Region
            - .amazonaws.com
    DynamoDBTableName:
      Description: CartFlow DynamoDB table name.
      Value:
        Ref: CartFlowTable
    ProductImagesBucketName:
      Description: Private S3 bucket for product image uploads.
      Value:
        Ref: ProductImagesBucket
    CognitoUserPoolId:
      Description: Cognito User Pool ID.
      Value:
        Ref: CartFlowUserPool
    CognitoUserPoolClientId:
      Description: Cognito User Pool web app client ID.
      Value:
        Ref: CartFlowUserPoolClient
    CognitoIssuer:
      Description: JWT issuer URL for API Gateway HTTP API authorizer and Lambda validation.
      Value:
        Fn::Join:
          - ''
          - - https://cognito-idp.
            - Ref: AWS::Region
            - .amazonaws.com/
            - Ref: CartFlowUserPool
    AdminGroupName:
      Description: Cognito group name used for admin authorization.
      Value: ${self:custom.stageConfig.auth.adminGroupName}
    CustomerGroupName:
      Description: Cognito group name used for customer authorization.
      Value: ${self:custom.stageConfig.auth.customerGroupName}
