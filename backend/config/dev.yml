region: us-east-1
nodeEnv: development
resourceSuffix: local

lambda:
  memorySize: 256
  timeout: 10
  logRetentionInDays: 7

cors:
  allowedOrigins:
    - http://localhost:5173
  allowedOriginsCsv: http://localhost:5173

uploads:
  presignedUrlExpiresSeconds: '300'
  maxBytes: '5242880'

pagination:
  defaultLimit: '20'
  maxLimit: '100'

# Account-/stage-level API Gateway throttling (default route settings —
# applies to every route that doesn't declare its own). Low on purpose in
# dev: this stage is meant for a single developer, and a low ceiling makes a
# runaway local test loop or misbehaving script fail fast and visibly rather
# than quietly burn through the AWS account's request quota.
throttle:
  burstLimit: 20
  rateLimit: 10

auth:
  customerGroupName: customer
  adminGroupName: admin

dynamodb:
  deletionPolicy: Delete
  pointInTimeRecovery: false

s3:
  deletionPolicy: Delete
  versioningStatus: Suspended
  temporaryUploadExpirationDays: 1

cognito:
  deletionPolicy: Delete
  callbackUrls:
    - http://localhost:5173/auth/callback
  logoutUrls:
    - http://localhost:5173/

esbuild:
  minify: false
  sourcemap: true
